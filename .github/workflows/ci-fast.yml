name: CI Fast — dev push

# Secret scan + Terraform fmt/validate/tflint on every push to dev.
# Uses -backend=false so no AWS credentials are needed.
# Paths filter: skips the job when only README or docs change.

on:
  push:
    branches: [dev]
    paths:
      - '**.tf'
      - '**.tfvars'
      - '.github/workflows/**'

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-lint:
    name: Terraform Fmt, Validate & tflint
    runs-on: ubuntu-latest
    needs: gitleaks
    timeout-minutes: 10
    env:
      TF_PLUGIN_CACHE_DIR: ${{ runner.tool_cache }}/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Create plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init (no backend)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - name: tflint init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: tflint
        run: tflint --recursive
