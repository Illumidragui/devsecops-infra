name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true

jobs:
  deploy:
    name: Terraform — VPC + EC2 + EIP
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy'
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_tailscale_authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~1.9"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${SSH_PRIVATE_KEY}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # Join Tailnet before Phase 1 so we can verify the hostname slot is free
      # before the new EC2 boots and tries to register as lab-kubernetes.
      - uses: tailscale/github-action@4e4c49acaa9818630ce0bd7a564372c17e33fb4d # v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENTID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      # Ephemeral devices are removed from the Tailnet after they disconnect,
      # but cleanup can take 1–2 min. If we deploy before the old lab-kubernetes
      # device is gone, the new EC2 gets a suffixed hostname and the workflow
      # resolves a stale dead IP instead of the new one.
      - name: Wait for lab-kubernetes hostname slot to be free
        run: |
          TS_HOSTNAME="lab-kubernetes"
          echo "Checking for stale '${TS_HOSTNAME}' device in Tailnet..."
          for i in $(seq 1 12); do
            if ! tailscale ip -4 "${TS_HOSTNAME}" 2>/dev/null | grep -q .; then
              echo "Hostname slot is free, proceeding"
              break
            fi
            [ $i -eq 12 ] && { echo "ERROR: stale device still present after 3 min. Delete it from Tailscale admin and retry."; exit 1; }
            echo "Attempt $i/12 — stale device still visible, waiting 15s..."
            sleep 15
          done

      - name: Terraform init
        run: terraform init

      - name: Terraform apply — VPC, EC2, EIP, DNS
        run: |
          terraform apply -auto-approve \
            -target=module.vpc \
            -target=module.ec2 \
            -target=aws_eip.k3s \
            -target=aws_eip_association.k3s \
            -target=cloudflare_dns_record.apex \
            -target=cloudflare_dns_record.www \
            -target=cloudflare_dns_record.hello \
            -target=cloudflare_dns_record.kuberflow

      - name: Wait for k3s, then copy kubeconfig
        run: |
          TS_HOSTNAME="lab-kubernetes"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/deploy_key"

          echo "Waiting for node to appear in Tailnet (up to 15 min)..."
          for i in $(seq 1 60); do
            TAILSCALE_IP=$(tailscale ip -4 "${TS_HOSTNAME}" 2>/dev/null) || true
            [ -n "${TAILSCALE_IP}" ] && { echo "Node visible at ${TAILSCALE_IP}"; break; }
            [ $i -eq 60 ] && { echo "Timed out waiting for node in Tailnet"; exit 1; }
            echo "Attempt $i/60 — retrying in 15s"
            sleep 15
          done

          echo "Polling until k3s is ready (up to 10 min)..."
          for i in $(seq 1 40); do
            if ssh $SSH_OPTS ec2-user@${TAILSCALE_IP} "sudo kubectl get nodes --no-headers 2>/dev/null" | grep -q "Ready"; then
              echo "k3s ready after attempt $i"
              break
            fi
            [ $i -eq 40 ] && { echo "Timed out waiting for k3s"; exit 1; }
            echo "Attempt $i/40 — retrying in 15s"
            sleep 15
          done

          mkdir -p ~/.kube
          scp $SSH_OPTS ec2-user@${TAILSCALE_IP}:/etc/rancher/k3s/k3s.yaml ~/.kube/devsecops-config
          sed -i "s/127.0.0.1/${TAILSCALE_IP}/g" ~/.kube/devsecops-config
          echo "Kubeconfig written to ~/.kube/devsecops-config"
          echo "Run scripts/bootstrap-argocd.sh locally to complete GitOps setup."

      - name: Print public IP
        run: terraform output public_ip
