name: Destroy Infrastructure (full teardown)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy-all" to confirm'
        required: true

jobs:
  destroy-all:
    name: Destroy EC2 + VPC + EIP (apex/www DNS kept, hello/kuberflow removed)
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy-all'
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_tailscale_authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      # cloudflare_dns_record.hello/.kuberflow ARE targeted below, so this needs
      # to be a real token via repo secrets — CLOUDFLARE_API_TOKEN must be set.
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENTID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Remove EC2 from Tailscale
        continue-on-error: true
        env:
          TAILSCALE_API_TOKEN: ${{ secrets.TAILSCALE_API_TOKEN }}
        run: |
          DEVICE_ID=$(curl -sf -H "Authorization: Bearer ${TAILSCALE_API_TOKEN}" \
            "https://api.tailscale.com/api/v2/tailnet/-/devices" \
            | jq -r '.devices[] | select(.hostname == "lab-kubernetes") | .id')
          if [ -z "${DEVICE_ID}" ]; then
            echo "Device not found in Tailnet, nothing to delete"
            exit 0
          fi
          curl -sf -X DELETE -H "Authorization: Bearer ${TAILSCALE_API_TOKEN}" \
            "https://api.tailscale.com/api/v2/device/${DEVICE_ID}"
          echo "Removed lab-kubernetes from Tailscale"

      - name: Destroy EC2 + VPC + EIP + hello/kuberflow DNS
        run: |
          terraform destroy -auto-approve \
            -target=aws_eip_association.k3s \
            -target=module.ec2 \
            -target=aws_eip.k3s \
            -target=module.vpc \
            -target=cloudflare_dns_record.hello \
            -target=cloudflare_dns_record.kuberflow

      - name: Warn about dangling DNS
        run: |
          echo "::warning::cloudflare_dns_record.apex / .www for shengjunye.me still point at the now-released EIP. They were intentionally kept out of this destroy — update or redeploy before relying on the domain again."
