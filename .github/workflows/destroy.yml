name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true

jobs:
  destroy:
    name: Destroy EC2 (EIP + VPC kept)
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_tailscale_authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      # Unused by this destroy (cloudflare_dns_record.* is never targeted) but the
      # provider block in versions.tf requires a value or terraform prompts and hangs.
      TF_VAR_cloudflare_api_token: "unused"

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~1.9"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - uses: tailscale/github-action@4e4c49acaa9818630ce0bd7a564372c17e33fb4d # v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENTID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Remove EC2 from Tailscale
        continue-on-error: true
        env:
          TAILSCALE_API_TOKEN: ${{ secrets.TAILSCALE_API_TOKEN }}
        run: |
          DEVICE_ID=$(curl -sf -H "Authorization: Bearer ${TAILSCALE_API_TOKEN}" \
            "https://api.tailscale.com/api/v2/tailnet/-/devices" \
            | jq -r '.devices[] | select(.hostname == "lab-kubernetes") | .id')
          if [ -z "${DEVICE_ID}" ]; then
            echo "Device not found in Tailnet, nothing to delete"
            exit 0
          fi
          curl -sf -X DELETE -H "Authorization: Bearer ${TAILSCALE_API_TOKEN}" \
            "https://api.tailscale.com/api/v2/device/${DEVICE_ID}"
          echo "Removed lab-kubernetes from Tailscale"

      - name: Destroy EIP association + EC2
        run: |
          terraform destroy -auto-approve \
            -target=aws_eip_association.k3s \
            -target=module.ec2

      - name: Confirm EIP is preserved
        run: |
          echo "EIP allocation preserved:"
          terraform output public_ip
